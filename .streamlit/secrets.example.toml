# Copy to .streamlit/secrets.toml locally, or paste into Streamlit Cloud → App settings → Secrets.
# Everything is optional: without secrets the app serves the bundled demo sites only.

# Earth Engine service-account key (the whole JSON, as one string) → enables "Analyze an area"
GEE_SERVICE_ACCOUNT = '''{"type": "service_account", "project_id": "bluecarbon-ai", "client_email": "...", "private_key": "..."}'''
GEE_PROJECT = "bluecarbon-ai"

# URL of a trained checkpoint (e.g. a GitHub Release asset). Defaults to the bundled pilot model.
# MODEL_URL = "https://github.com/yanicksanchez14-creator/bluecarbon-ai/releases/download/v2.0.0/model.pt"
