name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Lint
        run: ruff check src tests app scripts
      - name: Test
        run: pytest -q -rf --tb=short
      - name: Deployed model loads
        run: python -c "from bluecarbon.predictors import load_predictor; load_predictor('models/' + open('models/current.txt').read().strip())"
